<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020706">
  <title>ORB — Body Lab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="stage" aria-label="ORB Body Lab">
    <button class="orb-button" id="orb" aria-label="Touch ORB to change state">
      <span class="orb-glow"></span>
      <span class="orb-core"></span>
      <span class="orb-eye" aria-hidden="true"></span>
      <span class="orb-edge"></span>
      <span class="ring ring-one"></span>
      <span class="ring ring-two"></span>
    </button>
    <p class="state" id="state">resting</p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
